# Nightsea Theme - dark black/blue terminal theme
# Hue-shifted from studio1804-monochrome.conf with a lightness-skewed chroma
# curve (hue 210): near-zero tint on dark colors, strong tint on light ones,
# pure black/white preserved, so ANSI contrast levels match Mono exactly.

# Standard ANSI colors (0-7) - Nightsea (hue 210, skewed chroma curve)
palette = 0=000000
palette = 1=ffffff
palette = 2=6e8092
palette = 3=ffffff
palette = 4=86a0ba
palette = 5=6e8092
palette = 6=86a0ba
palette = 7=e2f0fe

# Bright ANSI colors (8-15) - Nightsea (hue 210, skewed chroma curve)
palette = 8=3d4043
palette = 9=ffffff
palette = 10=86a0ba
palette = 11=ffffff
palette = 12=b4d0ec
palette = 13=86a0ba
palette = 14=c9e0f7
palette = 15=ffffff

# Core terminal colors
background = 000000
foreground = ffffff
cursor-color = ffffff

# Selection colors
selection-background = ffffff
selection-foreground = 000000
