# Nightsea Theme - dark black/blue terminal theme
# Hue-shifted from studio1804-monochrome.conf: HSL(210, 22%, L) at each
# original grey's lightness L, so ANSI contrast levels match Mono exactly.

# Standard ANSI colors (0-7) - Nightsea (hue 210, sat 22%)
palette = 0=000000
palette = 1=ffffff
palette = 2=64809c
palette = 3=ffffff
palette = 4=8ba0b5
palette = 5=64809c
palette = 6=8ba0b5
palette = 7=edf0f3

# Bright ANSI colors (8-15) - Nightsea (hue 210, sat 22%)
palette = 8=32404e
palette = 9=ffffff
palette = 10=8ba0b5
palette = 11=ffffff
palette = 12=c6d0da
palette = 13=8ba0b5
palette = 14=d9e0e7
palette = 15=ffffff

# Core terminal colors
background = 000000
foreground = ffffff
cursor-color = ffffff

# Selection colors
selection-background = ffffff
selection-foreground = 000000
