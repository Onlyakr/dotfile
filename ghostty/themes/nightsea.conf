# Nightsea Theme - mostly Mono grey, with the ANSI blue slot (4/12) and
# yellow slot (3/11) carrying real color: blue and amber, matching the
# same accents used in nvim/zed. Everything else stays plain Mono.

# Standard ANSI colors (0-7) - blue/yellow accented, rest same as Mono
palette = 0=000000
palette = 1=ffffff
palette = 2=808080
palette = 3=e0a660
palette = 4=9bb9d7
palette = 5=808080
palette = 6=a0a0a0
palette = 7=f0f0f0

# Bright ANSI colors (8-15) - blue/yellow accented, rest same as Mono
palette = 8=404040
palette = 9=ffffff
palette = 10=a0a0a0
palette = 11=f0c088
palette = 12=aac8e6
palette = 13=a0a0a0
palette = 14=e0e0e0
palette = 15=ffffff

# Core terminal colors
background = 000000
foreground = ffffff
cursor-color = ffffff

# Selection colors
selection-background = ffffff
selection-foreground = 000000
